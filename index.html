<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f8fc">
  <title>이미지 용량 줄이기</title>
  <meta name="description" content="사진의 용량을 간편하게 줄이고 저장하세요.">
  <style>
  * {
    box-sizing: border-box;
  }

  :root {
    --primary: #4f46e5;
    --primary-dark: #3730a3;
    --text: #172033;
    --muted: #697386;
    --border: #e5e9f2;
    --background: #f6f8fc;
  }

  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--background);
    color: var(--text);
    line-height: 1.6;
  }

  header {
    padding: 26px 16px 30px;
    text-align: center;
    background: #ffffff;
    border-bottom: 1px solid var(--border);
  }

  header h1 {
    margin: 0;
    font-size: clamp(25px, 6vw, 34px);
    font-weight: 850;
    letter-spacing: -1.3px;
  }

  header p {
    max-width: 340px;
    margin: 8px auto 0;
    color: var(--muted);
    font-size: 14px;
  }

  main {
    width: min(100% - 28px, 560px);
    margin: 30px auto;
  }

  .panel {
    padding: 22px;
    background: #ffffff;
    border: 1px solid var(--border);
    border-radius: 24px;
    box-shadow: 0 14px 40px rgba(31, 41, 75, 0.06);
  }

  .dropzone {
    padding: 32px 14px;
    text-align: center;
    background: #fafaff;
    border: 2px dashed #c7c9f9;
    border-radius: 18px;
    transition: background 0.2s, border-color 0.2s;
  }

  .dropzone:active {
    background: #f0efff;
    border-color: var(--primary);
  }

  .photo-icon {
    font-size: 44px;
    margin-bottom: 8px;
  }

  .dropzone h2 {
    margin: 4px 0 8px;
    font-size: 20px;
    font-weight: 800;
    letter-spacing: -0.5px;
  }

  .muted {
    margin: 0;
    color: var(--muted);
    font-size: 13px;
    line-height: 1.8;
  }

  button,
  .file-button {
    display: inline-flex;
    justify-content: center;
    align-items: center;
    width: 100%;
    min-height: 50px;
    padding: 14px 18px;
    border: none;
    border-radius: 13px;
    background: var(--primary);
    color: #ffffff;
    font-size: 15px;
    font-weight: 750;
    text-align: center;
    text-decoration: none;
    cursor: pointer;
    -webkit-appearance: none;
    transition: background 0.2s, transform 0.2s;
  }

  button:active,
  .file-button:active {
    transform: scale(0.98);
  }

  button:disabled {
    opacity: 0.45;
    cursor: not-allowed;
  }

  .dropzone .file-button {
    width: auto;
    margin-top: 18px;
    padding-left: 25px;
    padding-right: 25px;
  }

  .field {
    margin-top: 26px;
  }

  .field label {
    display: block;
    margin-bottom: 12px;
    font-size: 15px;
    font-weight: 750;
  }

  #qualityText {
    color: var(--primary);
  }

  input[type="range"] {
    width: 100%;
    accent-color: var(--primary);
    cursor: pointer;
  }

  .range-row {
    display: flex;
    justify-content: space-between;
    margin-top: 5px;
    color: var(--muted);
    font-size: 12px;
  }

  .preview {
    display: none;
    width: 100%;
    max-height: 320px;
    object-fit: contain;
    margin-top: 22px;
    border: 1px solid var(--border);
    border-radius: 16px;
    background: #f3f5fa;
  }

  .actions {
    display: grid;
    gap: 12px;
    margin-top: 22px;
  }

  .status {
    margin-top: 16px;
    color: var(--muted);
    font-size: 13px;
    overflow-wrap: anywhere;
  }

  .result {
    display: none;
    margin-top: 24px;
    padding: 20px;
    border: 1px solid #dcdcff;
    border-radius: 18px;
    background: #f6f5ff;
  }

  .result strong {
    font-size: 19px;
    letter-spacing: -0.4px;
  }

  .result p {
    margin: 10px 0;
    font-size: 14px;
  }

  .result .file-button {
    margin-top: 0;
  }

  .secondary {
    background: #eceeff;
    color: var(--primary-dark);
  }

  footer {
    padding: 12px 20px 34px;
    color: #858da0;
    font-size: 12px;
    text-align: center;
  }

  @media (max-width: 380px) {
    .panel {
      padding: 16px;
      border-radius: 19px;
    }

    .dropzone {
      padding: 25px 10px;
    }
  }
</style>
</head>
<body>
  <header>
    <h1>🖼️ 이미지 용량 줄이기</h1>
    <p>사진을 간편하게 압축하고 저장하세요.</p>
  </header>
  <main>
    <section class="panel">
      <div class="dropzone">
        <div class="photo-icon">📷</div>
        <h2>사진을 선택하세요</h2>
        <p class="muted">JPG, PNG, WebP 이미지를 지원합니다.<br>사진은 서버로 업로드되지 않습니다.</p>
        <label class="file-button" for="fileInput">사진 선택하기</label>
        <input id="fileInput" type="file" accept="image/jpeg,image/png,image/webp" hidden>
      </div>
  <img id="preview" class="preview" alt="선택한 사진 미리보기">
  <div class="field">
    <label for="quality">압축 품질: <span id="qualityText">70%</span></label>
    <input id="quality" type="range" min="10" max="100" value="70">
    <input id="qualityNumber" type="number" min="1" max="100" step="1" value="70">
    <div class="range-row"><span>작은 용량</span><span>높은 화질</span></div>
  </div>
  <div class="control-group">
  <label for="targetReduction">목표 용량 감소율 (%)</label>
  <input
    id="targetReduction"
    type="number"
    min="0"
    max="95"
    step="1"
    value="55"
  >
</div>
  <div class="actions">
    <button id="compressButton" disabled>이미지 용량 줄이기</button>
  </div>
  <div id="status" class="status" role="status" aria-live="polite"></div>
  <section id="result" class="result">
    <strong>압축 완료!</strong>
    <p id="originalSize"></p>
    <p id="compressedSize"></p>
    <p id="savedSize"></p>
    <div class="actions">
      <a id="downloadButton" class="file-button" href="#" download="compressed-image.jpg">압축 이미지 저장하기</a>
      <button id="resetButton" class="secondary">다른 사진 선택하기</button>
    </div>
  </section>
</section>
  </main>
  <footer>간편하고 안전한 이미지 압축 도구</footer>
  <script>
    (() => {
      const fileInput = document.getElementById("fileInput");
      const quality = document.getElementById("quality");
      let previousQuality = null;
      let previousCompressedSize = null;
      const qualityText = document.getElementById("qualityText");
      const qualityNumber = document.getElementById("qualityNumber");

quality.addEventListener("input", () => {
  qualityNumber.value = quality.value;
});

qualityNumber.addEventListener("input", () => {
  if (qualityNumber.value === "") return;

  const value = Number(qualityNumber.value);

  if (!Number.isFinite(value)) return;

  if (value >= 10 && value <= 100) {
    quality.value = value;
    quality.dispatchEvent(new Event("input", { bubbles: true }));
  }
});

qualityNumber.addEventListener("change", () => {
  let value = Number(qualityNumber.value);

  if (qualityNumber.value === "" || !Number.isFinite(value)) {
    value = Number(quality.value);
  }

  value = Math.max(10, Math.min(100, value));

  qualityNumber.value = value;
  quality.value = value;
  quality.dispatchEvent(new Event("input", { bubbles: true }));
});
      const compressButton = document.getElementById("compressButton");
      const preview = document.getElementById("preview");
      const status = document.getElementById("status");
      const result = document.getElementById("result");
      const downloadButton = document.getElementById("downloadButton");
      let selectedFile = null;
      let previewUrl = null;
      let downloadUrl = null;
      function formatSize(bytes) {
        if (bytes < 1024) return bytes + " B";
        if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + " KB";
        return (bytes / (1024 * 1024)).toFixed(2) + " MB";
      }
      function clearUrl(url) {
        if (url) URL.revokeObjectURL(url);
      }
      function resetResult() {
        result.style.display = "none";
        clearUrl(downloadUrl);
        downloadUrl = null;
        downloadButton.removeAttribute("href");
      }
      function updateQualityText() {
        qualityText.textContent = quality.value + "%";
      }
      quality.addEventListener("input", updateQualityText);
      qualityNumber.addEventListener("input", updateQualityText);
      
      updateQualityText();
      fileInput.addEventListener("change", () => {
        resetResult();
        selectedFile = fileInput.files && fileInput.files[0];
        if (!selectedFile) {
          compressButton.disabled = true;
          return;
        }
        if (!["image/jpeg", "image/png", "image/webp"].includes(selectedFile.type)) {
          selectedFile = null;
          compressButton.disabled = true;
          status.textContent = "JPG, PNG, WebP 이미지 파일을 선택해 주세요.";
          return;
        }
        clearUrl(previewUrl);
        previewUrl = URL.createObjectURL(selectedFile);
        preview.src = previewUrl;
        preview.style.display = "block";
        compressButton.disabled = false;
        status.textContent = "선택한 파일: " + selectedFile.name + " (" + formatSize(selectedFile.size) + ")";
      });
      compressButton.addEventListener("click", async () => {
        if (!selectedFile) {
          status.textContent = "먼저 사진을 선택해 주세요.";
          return;
        }
        compressButton.disabled = true;
        status.textContent = "이미지를 압축하고 있습니다...";
        resetResult();
        try {
          const image = new Image();
          image.src = previewUrl;
          await new Promise((resolve, reject) => {
            image.onload = resolve;
            image.onerror = () => reject(new Error("이미지를 읽을 수 없습니다."));
          });
          const maxSide = 2560;
          const scale = Math.min(1, maxSide / Math.max(image.naturalWidth, image.naturalHeight));
          const canvas = document.createElement("canvas");
          canvas.width = Math.max(1, Math.round(image.naturalWidth * scale));
          canvas.height = Math.max(1, Math.round(image.naturalHeight * scale));
          const context = canvas.getContext("2d");
          if (!context) throw new Error("이미지 처리 기능을 사용할 수 없습니다.");
          context.fillStyle = "#ffffff";
          context.fillRect(0, 0, canvas.width, canvas.height);
          context.drawImage(image, 0, 0, canvas.width, canvas.height);
          const targetReduction = Number(
            document.getElementById("targetReduction").value
            );
          const originalSize = selectedFile.size;
          const targetSize = originalSize * (1 - targetReduction / 100);
          let low = 0.01;
          let high = 1;
          let bestBlob = null;
          let bestDifference = Infinity;
          for (let i = 0; i < 32; i++) {
            const q = (low + high) / 2;
            
            const testBlob = await new Promise((resolve, reject) => {
              canvas.toBlob(
                value => value
                  ? resolve(value)
                  : reject(new Error("압축에 실패했습니다.")),
                "image/jpeg",
                q
              );
            });
            
            const difference = Math.abs(testBlob.size - targetSize);
            
            if (difference < bestDifference) {
              bestDifference = difference;
              bestBlob = testBlob;
            }
            if (difference <= originalSize * 0.005) {
              break;
            }
            
            if (testBlob.size > targetSize) {
              high = q;
            } else {
              low = q;
            }
          }
          const blob = bestBlob;
            const q = (low + high) / 2;
            const testBlob = await new Promise((resolve, reject) => {
              canvas.toBlob(
                value => value
                ? resolve(value)
                : reject(new Error("압축에 실패했습니다.")),
                "image/jpeg",
                q
                );
            });
  const difference = Math.abs(testBlob.size - targetSize);
  if (difference < bestDifference) {
    bestDifference = difference;
    bestBlob = testBlob;
  }
  if (testBlob.size > targetSize) {
    high = q;
  } else {
    low = q;
  }
}
const blob = bestBlob;
          downloadUrl = URL.createObjectURL(blob);
          downloadButton.href = downloadUrl;
          downloadButton.download = "compressed-image.jpg";
          document.getElementById("originalSize").textContent =
            "원본 용량: " + formatSize(selectedFile.size);
          document.getElementById("compressedSize").textContent =
            "압축 용량: " + formatSize(blob.size);
          const difference = selectedFile.size - blob.size;
          document.getElementById("savedSize").textContent =
            difference > 0
              ? "절약한 용량: " + formatSize(difference) + " (" + Math.round(difference / selectedFile.size * 100) + "% 감소)"
              : "이 사진은 용량이 줄지 않았습니다. 품질을 낮춰 다시 시도해 보세요.";
          result.style.display = "block";
          status.textContent = "압축이 완료되었습니다.";
        } catch (error) {
          status.textContent = error.message || "오류가 발생했습니다. 다른 사진으로 시도해 주세요.";
        } finally {
          compressButton.disabled = !selectedFile;
        }
      });
      document.getElementById("resetButton").addEventListener("click", () => {
        fileInput.value = "";
        selectedFile = null;
        clearUrl(previewUrl);
        previewUrl = null;
        preview.removeAttribute("src");
        preview.style.display = "none";
        resetResult();
        compressButton.disabled = true;
        status.textContent = "";
      });
    })();
  </script>
</body>
